# Supabase CLI configuration for local development (`npx supabase start`).
# The hosted project must be configured to match — see README "Configure Supabase".

project_id = "ward-family-hub"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
# Local email catcher for invites and password resets: http://localhost:54324
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Invitation only: nobody can create an account from the app.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "letters_digits"

[auth.rate_limit]
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"

[auth.email.template.invite]
subject = "You're invited to Ward Family Hub"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your Ward Family Hub password"
content_path = "./supabase/templates/recovery.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "25MiB"
